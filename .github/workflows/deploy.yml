name: 🚀 Deploy to Cloudways

on:
  push:
    branches: [ soun ]  # deploy នៅពេល push ទៅ branch "soun"

jobs:
  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: ✅ Checkout Code
        uses: actions/checkout@v4

      - name: Force JavaScript to Node 24
        run: echo "FORCE_JAVASCRIPT_ACTIONS_TO_NODE24=true" >> $GITHUB_ENV

      # Step 2: SSH ចូល Server ហើយ Deploy
      - name: 🚀 Deploy to Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASS }}
          port: 22
          script: |
            echo "📂 Moving to project folder..."
            cd ~/applications/csqbtcfrsu/public_html

            echo "⬇️ Pulling latest code..."
            git pull origin soun
            git log -1 --stat

            echo "📦 Installing PHP dependencies..."
            composer install --no-dev --optimize-autoloader

            echo "📦 Installing Node dependencies..."
            npm install

            echo "🏗️ Building assets..."
            npm run build

            echo "🗄️ Running migrations..."
            php artisan migrate --force

            echo "🧹 Thoroughly clearing all caches..."
            php artisan optimize:clear

            echo "⚡ Re-optimizing..."
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan event:cache

            echo "✅ Deploy success!"
